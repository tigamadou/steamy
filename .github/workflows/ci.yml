# Intégration continue :
# - à chaque PR, sur le résultat de la fusion avec la branche cible (une poussée sur une branche
#   qui a une PR ne déclenche donc qu'UN run, pas deux : `push` + `pull_request`) ;
# - à chaque push sur main et development, pour vérifier ce qui vient d'être fusionné.
# Une branche sans PR n'est pas testée : ouvrir une PR (même brouillon) pour lancer la CI.
# Seules les parties touchées sont testées ; le job `ci-ok` agrège le résultat
# et c'est LUI qu'on rend obligatoire dans la protection de branche.
name: CI

on:
  pull_request:
  push:
    branches: [main, development]

# Une nouvelle poussée annule le run obsolète de la même PR. Sur main et development, jamais :
# la couverture du code modifié se compare au push précédent (`github.event.before`), un run
# annulé laisserait son commit sans contrôle. Groupe propre au commit, donc aucun run en attente écarté.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref_name == 'main' || github.ref_name == 'development') && github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      e2e: ${{ steps.filter.outputs.e2e }}
      compare: ${{ steps.compare.outputs.compare }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Référence de diff-cover (couverture du code modifié), calculée une seule fois pour tous les jobs :
      # PR → sa branche cible (origin/feature/<slug> pour un lot, origin/development pour la PR finale) ;
      # push sur main ou development → le push précédent ; hotfix/* → main ; sinon development.
      - name: Base de comparaison de la couverture
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            compare="origin/$BASE_REF"
          elif [ "$REF_NAME" = development ] || [ "$REF_NAME" = main ]; then
            compare="$BEFORE"
          elif [[ "$REF_NAME" == hotfix/* ]]; then
            compare=origin/main
          else
            compare=origin/development
          fi
          echo "compare=$compare" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Sur un push, on compare TOUTE la branche à sa branche d'origine (gitflow),
          # pas seulement au push précédent : un dernier push qui ne touche que la doc
          # ne doit pas masquer une API cassée plus tôt. Sur main/development : diff
          # depuis le push précédent. Ignoré pour les PR (diff de la PR).
          base: ${{ startsWith(github.ref_name, 'hotfix/') && 'main' || (github.ref_name == 'main' && 'main' || 'development') }}
          # Chaque partie ne déclenche que ses propres jobs. Seule une modification
          # de CE fichier relance tout : c'est le seul moyen de vérifier la CI elle-même.
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            # La CI appelle les cibles `make` : leur définition et celle de la stack de dev sont du code testé
            runtime: &runtime
              - 'Makefile'
              - 'compose.yml'
              - 'infra/dev/**'
              - 'scripts/cibles.sh'
              - 'scripts/coverage-diff.sh'
            api:
              - *ci
              - *runtime
              - 'apps/api/**'
            web:
              - *ci
              - *runtime
              - 'apps/web/**'
              - 'packages/**'
              - 'apps/api/openapi.yaml'   # contrat → types TypeScript du front
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.dockerignore'           # contexte de build de l'image web
            infra:
              - *ci
              - 'infra/**'
              - '.github/workflows/deploy.yml'
            # Parcours de bout en bout : un changement d'API peut casser un parcours,
            # le filtre `web` seul ne suffit pas.
            e2e:
              - *ci
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'compose.yml'
              - 'compose.e2e.yml'
              - 'Makefile'
              - 'pnpm-lock.yaml'

  # Les jobs appellent les cibles `make` des agents (docs/infra/agents.md) : tout tourne en conteneur, rien n'est
  # installé sur le runner. Le projet Compose s'appelle `steamy` pour que `docker compose run` retrouve les images
  # chargées ci-dessous (tags `steamy-<service>`). Une base par worker xdist : `test_steamy_gwN`.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: steamy
      CI: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # diff-cover compare la branche à sa base
      - uses: docker/setup-buildx-action@v3
      # Cache de couches en lecture seule (seul le shard 1 de l'e2e l'écrit). `api` et `api-migrate` partagent l'image.
      - name: Image api (dev)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: dev
          load: true
          tags: |
            steamy-api
            steamy-api-migrate
          cache-from: type=gha,scope=api-dev
      - name: Postgres et Redis
        run: docker compose up -d --wait postgres redis
      # En cas d'échec du lint : `make fix-api`, puis committer
      - run: make lint-api
      - run: make migrations-check
      # Suite complète en parallèle (pytest-xdist, une base par worker) : `--maxfail=0` liste tous les échecs en un run
      - name: Tests (suite complète)
        run: make test-api PYTEST_ARGS=--maxfail=0
      # Règle : 100 % de couverture (lignes et branches) sur le code ajouté ou modifié. En local : `make coverage-api`.
      - name: Couverture du code modifié = 100 %
        run: make coverage-api BASE=${{ needs.changes.outputs.compare }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: steamy
      CI: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # diff-cover compare la branche à sa base
      # `make typecheck` installe les dépendances dans les volumes du conteneur web : à lancer avant les autres cibles
      - run: make typecheck
      - run: make lint-web
      - name: Tests (suite complète)
        run: make test-web
      # Règle : 100 % de couverture sur le code ajouté ou modifié. En local : `make coverage-web`.
      - name: Couverture du code modifié = 100 %
        run: make coverage-web BASE=${{ needs.changes.outputs.compare }}

  # Contrat d'API : openapi.yaml et les types TypeScript du client doivent être à jour (l'API et le front y sont nécessaires)
  generated:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: steamy
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image api (dev)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: dev
          load: true
          tags: steamy-api
          cache-from: type=gha,scope=api-dev
      - name: Postgres et Redis
        run: docker compose up -d --wait postgres redis
      - run: make check-generated

  # Une image par job : modifier le front ne reconstruit pas l'image de l'API
  image-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image api (sans push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  image-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image web (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Parcours Playwright sur la stack Docker (`make e2e`, voir compose.e2e.yml), répartis en 4 shards
  # parallèles : chacun monte SA stack (base, données de démo rechargées) et joue un quart des tests,
  # tous projets confondus. Les parcours `@donnees-uniques` ne sont que dans le projet « bureau » et
  # chaque test n'est que dans un shard : ils consomment toujours une donnée de démo intacte.
  # Les navigateurs viennent de l'image officielle Playwright, épinglée sur la version de @playwright/test.
  # Les images sont construites ici avec le cache de couches GitHub (scope partagé avec `image-web`).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image web (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          load: true
          tags: steamy-web-e2e
          cache-from: type=gha,scope=web
      # Une seule image pour l'API, le worker et la migration : compose lui donne un nom par service
      - name: Image api (dev)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: dev
          load: true
          tags: |
            steamy-e2e-api
            steamy-e2e-api-migrate
            steamy-e2e-worker
            steamy-e2e-beat
          cache-from: type=gha,scope=api-dev
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max,scope=api-dev' || '' }}
      - run: make e2e E2E_BUILD=--no-build PW_ARGS=--shard=${{ matrix.shard }}/4
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Journaux de la stack
        if: failure()
        run: docker compose -p steamy-e2e -f compose.yml -f compose.e2e.yml logs --no-color --tail=200 api web
      - name: Arrêt de la stack
        if: always()
        run: make e2e-down

  # Tests fonctionnels sur fixtures (docs/tests/PLAN-DE-TESTS.md, § 3) : le front de production contre la fausse API de
  # apps/web/e2e/fausse-api/, sans base ni API. `make e2e-fixtures` joue Playwright dans l'image officielle (conteneur).
  e2e-fixtures:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: steamy
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - run: make e2e-fixtures
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fixtures
          path: |
            apps/web/playwright-report-fixtures/
            apps/web/test-results/
          retention-days: 7

  helm:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0   # même version que les serveurs (infra/ansible/group_vars/all.yml)
      - name: Lint et rendu des charts (staging et prod)
        run: |
          for chart in steamy steamy-platform; do
            for env in staging production; do
              helm lint infra/helm/$chart -f infra/helm/$chart/values-$env.yaml --set image.tag=0.0.0-ci
              helm template $chart infra/helm/$chart -f infra/helm/$chart/values-$env.yaml \
                --set image.tag=0.0.0-ci > /tmp/$chart-$env.yaml
            done
          done
      - name: Validation des manifestes Kubernetes
        run: |
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m/steamy-staging.yaml /m/steamy-production.yaml \
            /m/steamy-platform-staging.yaml /m/steamy-platform-production.yaml
      - name: Shellcheck du script de déploiement
        run: shellcheck infra/deploy/steamy-deploy.sh

  # Règle : 100 % des écrans v1 ont un test e2e. Tout écran livré (case cochée dans un plan)
  # doit citer un test existant dans docs/tests/MATRICE-E2E.md. Contrôle rapide, toujours lancé.
  e2e-matrice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Matrice écran → test e2e
        run: python3 scripts/e2e_matrix.py --check
      # Cahier et tests : toute ligne `auto` du cahier a son étape `REC-…` dans un test, toute étape cite une ligne existante
      - name: Cahier de recette ↔ tests automatiques
        run: python3 scripts/cahier_check.py

  # Point de contrôle unique pour la protection de branche.
  # `changes` est surveillé aussi : s'il échoue, tous les autres jobs sont sautés,
  # et « tout sauté » ne doit pas passer pour un succès.
  ci-ok:
    if: always()
    needs: [changes, api, web, generated, image-api, image-web, e2e, e2e-fixtures, helm, e2e-matrice]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs exécutés ont réussi
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
