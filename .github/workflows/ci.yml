# Intégration continue, sur toutes les branches :
# - à chaque push, pour être prévenu dès qu'une branche casse quelque chose ;
# - à chaque PR, sur le résultat de la fusion avec la branche cible.
# Seules les parties touchées sont testées ; le job `ci-ok` agrège le résultat
# et c'est LUI qu'on rend obligatoire dans la protection de branche.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Sur un push, on compare TOUTE la branche à sa branche d'origine (gitflow),
          # pas seulement au push précédent : un dernier push qui ne touche que la doc
          # ne doit pas masquer une API cassée plus tôt. Sur main/development : diff
          # depuis le push précédent. Ignoré pour les PR (diff de la PR).
          base: ${{ startsWith(github.ref_name, 'hotfix/') && 'main' || (github.ref_name == 'main' && 'main' || 'development') }}
          # Chaque partie ne déclenche que ses propres jobs. Seule une modification
          # de CE fichier relance tout : c'est le seul moyen de vérifier la CI elle-même.
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            api:
              - *ci
              - 'apps/api/**'
            web:
              - *ci
              - 'apps/web/**'
              - 'packages/**'
              - 'apps/api/openapi.yaml'   # contrat → types TypeScript du front
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.dockerignore'           # contexte de build de l'image web
            infra:
              - *ci
              - 'infra/**'
              - '.github/workflows/deploy.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_DB: steamy
          POSTGRES_USER: steamy
          POSTGRES_PASSWORD: steamy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steamy" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    env:
      DJANGO_ENV: test
      SECRET_KEY: ci
      POSTGRES_DB: steamy
      POSTGRES_USER: steamy
      POSTGRES_PASSWORD: steamy
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CHANNELS_REDIS_URL: redis://localhost:6379/2
      # Pas de stockage S3 en CI
      DEFAULT_FILE_STORAGE: django.core.files.storage.FileSystemStorage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Dépendances système (WeasyPrint, PostgreSQL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      # En cas d'échec : `make fix-api`, puis committer
      - name: Lint (Ruff)
        run: ruff check --output-format=github .
      - name: Format (Ruff)
        run: ruff format --check --diff .
      - name: Migrations manquantes ?
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
      - name: Contrat OpenAPI à jour ?
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          if ! diff -q openapi.yaml /tmp/openapi.yaml; then
            echo "::error file=apps/api/openapi.yaml::openapi.yaml n'est plus à jour : lancer \`make openapi\` et committer."
            diff -u openapi.yaml /tmp/openapi.yaml | head -50
            exit 1
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types du client d'API à jour ?
        run: |
          pnpm api-client:generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts \
            || { echo "::error::schema.d.ts n'est plus à jour : lancer \`make openapi\` et committer."; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Une image par job : modifier le front ne reconstruit pas l'image de l'API
  image-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image api (sans push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  image-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image web (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  helm:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint et rendu des charts (staging et prod)
        run: |
          for chart in steamy steamy-platform; do
            for env in staging production; do
              helm lint infra/helm/$chart -f infra/helm/$chart/values-$env.yaml --set image.tag=0.0.0-ci
              helm template $chart infra/helm/$chart -f infra/helm/$chart/values-$env.yaml \
                --set image.tag=0.0.0-ci > /tmp/$chart-$env.yaml
            done
          done
      - name: Validation des manifestes Kubernetes
        run: |
          docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m/steamy-staging.yaml /m/steamy-production.yaml \
            /m/steamy-platform-staging.yaml /m/steamy-platform-production.yaml
      - name: Shellcheck du script de déploiement
        run: shellcheck infra/deploy/steamy-deploy.sh

  # Point de contrôle unique pour la protection de branche
  ci-ok:
    if: always()
    needs: [api, web, image-api, image-web, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs exécutés ont réussi
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
