- name: Version de k3s installée
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Installation / mise à jour de k3s {{ k3s_version }}
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION='{{ k3s_version }}' sh -s - server \
      --write-kubeconfig-mode 0600 \
      --secrets-encryption
  args:
    executable: /bin/bash
  when: k3s_version not in (k3s_installed.stdout | default(''))
  changed_when: true

- name: Nœud prêt
  ansible.builtin.command: k3s kubectl wait node --all --for=condition=Ready --timeout=300s
  changed_when: false

- name: Version de Helm installée
  ansible.builtin.command: helm version --short
  register: k3s_helm_installed
  changed_when: false
  failed_when: false

- name: Installation de Helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/helm"]
    mode: "0755"
  when: helm_version not in (k3s_helm_installed.stdout | default(''))
