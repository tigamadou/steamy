apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamy-web
  labels:
    {{- include "steamy.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "steamy.selector" "web" | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "steamy.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "steamy.podDefaults" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "steamy.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "steamy.containerSecurity" . | nindent 10 }}
          env:
            # Appels serveur → API par le réseau interne du cluster
            - name: API_URL
              value: http://steamy-api
            # Appels navigateur → API, servie au client par /runtime-config
            - name: PUBLIC_API_URL
              value: {{ printf "https://%s" .Values.hosts.api | quote }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: steamy-web
  labels:
    {{- include "steamy.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "steamy.selector" "web" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
