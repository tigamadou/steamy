apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamy-api
  labels:
    {{- include "steamy.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "steamy.selector" "api" | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "steamy.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "steamy.podDefaults" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "steamy.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "steamy.containerSecurity" . | nindent 10 }}
          env:
            {{- include "steamy.apiEnv" . | nindent 12 }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.api.gunicornWorkers | quote }}
          ports:
            - name: http
              containerPort: 8000
          # Prêt seulement si PostgreSQL et Redis répondent
          readinessProbe:
            httpGet: { path: /api/health/, port: http, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 10
            failureThreshold: 3
          # Vivant tant que le processus écoute (ne pas redémarrer si la base tousse)
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: steamy-api
  labels:
    {{- include "steamy.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "steamy.selector" "api" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
