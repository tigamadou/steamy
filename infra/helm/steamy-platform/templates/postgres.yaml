apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: steamy-db
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  # Base `app`, propriétaire `app` ; CloudNativePG génère le Secret `steamy-db-app`
  # (clé `uri`) lu par l'application.
  # Le bootstrap ne sert qu'à la CRÉATION du cluster : base vide, ou reconstruite
  # depuis les sauvegardes Wasabi (postgres.restore).
  bootstrap:
  {{- with .Values.postgres.restore }}
  {{- if .enabled }}
    recovery:
      source: sauvegarde
      database: app
      owner: app
      {{- with .targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
  {{- else }}
    initdb:
      database: app
      owner: app
  {{- end }}
  {{- end }}
  {{- if .Values.postgres.restore.enabled }}
  {{- if eq .Values.postgres.serverName .Values.postgres.restore.fromServerName }}
  {{- fail "postgres.serverName doit différer de postgres.restore.fromServerName : la base reconstruite archive dans un dossier vierge" }}
  {{- end }}
  externalClusters:
    - name: sauvegarde
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: wasabi
          serverName: {{ required "postgres.restore.fromServerName est obligatoire" .Values.postgres.restore.fromServerName | quote }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.storage }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  # Archivage continu des WAL vers Wasabi → restauration à n'importe quel instant
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: wasabi
        # Dossier d'archivage : <bucket>/<env>/postgres/<serverName>/
        serverName: {{ .Values.postgres.serverName | quote }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wasabi
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ .Values.backups.postgresRetention | quote }}
  configuration:
    destinationPath: {{ include "platform.backupPrefix" . }}/postgres/
    endpointURL: {{ .Values.backups.wasabi.endpoint }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.secretName }}
        key: WASABI_ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.secretName }}
        key: WASABI_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Contournement documenté pour les stockages S3-compatibles (boto3 récent)
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: steamy-db-daily
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backups.postgresSchedule | quote }}
  backupOwnerReference: self
  immediate: true
  cluster:
    name: steamy-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
