# Redis : cache, sessions, broker Celery, Channels.
# Persistance AOF : un redémarrage ne doit pas perdre les tâches Celery en attente
# (SMS de consentement parental, e-mails…).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: steamy-redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  serviceName: steamy-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: steamy-redis }
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: steamy-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--save", ""]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: steamy-redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: steamy-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
