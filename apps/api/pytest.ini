# `-n` est passé par les cibles `make` (nombre de workers : `pytest_xdist_auto_num_workers` de conftest.py) :
# un test ciblé ne paie ni le démarrage de workers ni la création de bases supplémentaires.
[pytest]
DJANGO_SETTINGS_MODULE = project.settings
python_files = tests.py test_*.py *_tests.py
addopts = --maxfail=1 -q

filterwarnings =
    # kombu Deprecation (SelectableGroups)
    ignore:SelectableGroups dict interface is deprecated. Use select.:DeprecationWarning:kombu.utils.compat
    # DRF / Django compatibility warning (Django 6.0 deprecation)
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    # Whitenoise "No directory at" -> on filtre par message + catégorie UserWarning (module optionnel)
    ignore:No directory at:UserWarning
    ignore:SelectableGroups dict interface is deprecated. Use select.:DeprecationWarning:kombu.utils.compat


