components:
  schemas:
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        quiz:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        data:
          nullable: true
      required:
      - createdAt
      - id
      - passed
      - quiz
      - score
      - user
    AttemptCreate:
      type: object
      description: |-
        Atttempt: client envoie `data` : {question_id: choice_id} pour MCQ/TF
        On calcule le score côté serveur à la sauvegarde via create()
