components:
  schemas:
    Activity:
      type: object
      properties:
        secondsCounted:
          type: integer
          description: Secondes retenues après plafonnement
        secondsToday:
          type: integer
        streakDays:
          type: integer
      required:
      - secondsCounted
      - secondsToday
      - streakDays
    ActivityRequestRequest:
      type: object
      properties:
        missionId:
          type: integer
        seconds:
          type: integer
          maximum: 3600
          minimum: 1
          description: Secondes réellement lues
      required:
      - missionId
      - seconds
    AnswerRequest:
      type: object
      properties:
        questionId:
          type: integer
        choiceId:
          type: integer
      required:
      - choiceId
      - questionId
    AreaTypeEnum:
      enum:
      - urban
      - rural
      type: string
      description: |-
        * `urban` - Urbaine
        * `rural` - Rurale
    AttemptDetail:
      type: object
      description: Résultat d'une tentative (WJ05, WJ08, WD08).
      properties:
        id:
          type: integer
        quiz:
          $ref: '#/components/schemas/AttemptQuiz'
        score:
          type: integer
        total:
          type: integer
        percentage:
          type: integer
        threshold:
          type: integer
          description: Seuil appliqué à cette tentative (%)
        status:
          $ref: '#/components/schemas/AttemptStatusEnum'
        passed:
          type: boolean
        durationSec:
          type: integer
          nullable: true
        pointsEarned:
          type: integer
        createdAt:
          type: string
          format: date-time
        badge:
          allOf:
          - $ref: '#/components/schemas/Badge'
          nullable: true
          description: Badge du niveau ou du projet, si la tentative est réussie (WJ06,
            WJ11)
        failedConcepts:
          type: array
          items:
            type: string
        remediation:
          type: array
          items:
            $ref: '#/components/schemas/Remediation'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionReview'
        retryInSec:
          type: integer
          description: Secondes avant de pouvoir repasser le quiz (sommative ratée,
            D32)
        next:
          allOf:
          - $ref: '#/components/schemas/NextStep'
          nullable: true
          description: 'Après une réussite : étape suivante (après le badge) ; sinon
            null'
      required:
      - badge
      - createdAt
      - durationSec
      - failedConcepts
      - id
      - next
      - passed
      - percentage
      - pointsEarned
      - questions
      - quiz
      - remediation
      - retryInSec
      - score
      - status
      - threshold
      - total
    AttemptListItem:
      type: object
      properties:
        id:
          type: integer
        quiz:
          $ref: '#/components/schemas/AttemptQuiz'
        score:
          type: integer
        total:
          type: integer
        percentage:
          type: integer
        threshold:
          type: integer
          description: Seuil appliqué à cette tentative (%)
        status:
          $ref: '#/components/schemas/AttemptStatusEnum'
        passed:
          type: boolean
        durationSec:
          type: integer
          nullable: true
        pointsEarned:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - durationSec
      - id
      - passed
      - percentage
      - pointsEarned
      - quiz
      - score
      - status
      - threshold
      - total
    AttemptQuiz:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/QuizKindEnum'
        title:
          type: string
        courseSlug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        projectId:
          type: integer
        levelId:
          type: integer
          nullable: true
      required:
      - courseSlug
      - id
      - kind
      - levelId
      - projectId
      - title
    AttemptRequestRequest:
      type: object
      description: Envoi groupé de toutes les réponses ; une question sans réponse
        compte comme fausse.
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerRequest'
        durationSec:
          type: integer
          minimum: 0
          nullable: true
      required:
      - answers
    AttemptStatusEnum:
      enum:
      - ok
      - warn
      - ko
      type: string
      description: |-
        * `ok` - Réussi
        * `warn` - À refaire
        * `ko` - Échoué
    Avatar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 120
        emoji:
          type: string
          maxLength: 8
        color:
          type: string
          title: Couleur
          description: Jeton du design system, ex. « primary-500 »
          maxLength: 32
      required:
      - code
      - color
      - emoji
      - id
      - label
    Badge:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/BadgeKindEnum'
        label:
          type: string
        icon:
          type: string
        description:
          type: string
      required:
      - description
      - icon
      - id
      - kind
      - label
    BadgeKindEnum:
      enum:
      - level
      - project
      - course
      type: string
      description: |-
        * `level` - Niveau
        * `project` - Projet
        * `course` - Parcours
    Beneficiary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
      required:
      - firstName
      - id
    Cart:
      type: object
      description: 'Panier (WK03, WK10) : prix courants des kits ; le total définitif
        est celui de la commande.'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        count:
          type: integer
          description: Nombre d'articles (somme des quantités)
        subtotal:
          type: integer
          description: Somme des lignes, hors livraison (FCFA)
      required:
      - count
      - items
      - subtotal
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kit:
          allOf:
          - $ref: '#/components/schemas/Kit'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          title: Quantité
        total:
          type: integer
          readOnly: true
      required:
      - id
      - kit
      - quantity
      - total
    CartItemCreateRequest:
      type: object
      properties:
        kitSlug:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - kitSlug
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 80
        color:
          type: string
          title: Couleur
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          title: Icône
          description: Emoji affiché sur les cartes
          maxLength: 16
        courseCount:
          type: integer
          readOnly: true
          description: Parcours publiés
      required:
      - color
      - courseCount
      - icon
      - label
      - slug
    CategoryEnum:
      enum:
      - learning
      - rewards
      - coaching
      - events
      - payments
      - consents
      - progress
      - reviews
      - account
      type: string
      description: |-
        * `learning` - Apprentissage
        * `rewards` - Récompenses
        * `coaching` - Encadrement
        * `events` - Steamy Events
        * `payments` - Paiements
        * `consents` - Consentements et validations
        * `progress` - Progression
        * `reviews` - Tentatives à revoir
        * `account` - Compte
    CategoryPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        label:
          type: string
          readOnly: true
        inApp:
          type: boolean
          readOnly: true
          description: Toujours actif
        email:
          type: boolean
      required:
      - category
      - email
      - inApp
      - label
    CategoryPreferenceRequest:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        email:
          type: boolean
      required:
      - category
      - email
    CategorySummary:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 80
        color:
          type: string
          title: Couleur
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          title: Icône
          description: Emoji affiché sur les cartes
          maxLength: 16
      required:
      - color
      - icon
      - label
      - slug
    Certificate:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          description: CERT-AAAA-NNNNNN
        course:
          $ref: '#/components/schemas/CourseRef'
        issuedAt:
          type: string
          format: date-time
        pdfStatus:
          allOf:
          - $ref: '#/components/schemas/PdfStatusEnum'
          description: |-
            `pending` : « Préparation… », interroger de nouveau ; `failed` : échec signalé au Support

            * `pending` - En préparation
            * `ready` - Prêt
            * `failed` - Échec
      required:
      - course
      - id
      - issuedAt
      - number
      - pdfStatus
    Certification:
      type: object
      description: Conditions D33 (100 % des missions, toutes les sommatives réussies),
        certificat et ticket (WJ07, WJ09).
      properties:
        eligible:
          type: boolean
        missionsDone:
          type: integer
        missionCount:
          type: integer
        summativesPassed:
          type: integer
        summativeCount:
          type: integer
        certificateEnabled:
          type: boolean
        certificate:
          allOf:
          - $ref: '#/components/schemas/Certificate'
          nullable: true
        eventTicket:
          type: boolean
          description: Ticket Steamy Events offert à la certification
      required:
      - certificate
      - certificateEnabled
      - eligible
      - eventTicket
      - missionCount
      - missionsDone
      - summativeCount
      - summativesPassed
    Choice:
      type: object
      description: Réponse proposée, sans le corrigé.
      properties:
        id:
          type: integer
        text:
          type: string
      required:
      - id
      - text
    ConsentPreview:
      type: object
      description: 'Ce que montre le lien SMS avant toute connexion : le numéro masqué,
        rien de l''enfant.'
      properties:
        parentPhoneMasked:
          type: string
      required:
      - parentPhoneMasked
    ConsentRequest:
      type: object
      description: 'Demande vue par le parent (WP04, WP05) : seulement ce qui existe
        à ce stade (D20).'
      properties:
        id:
          type: integer
          readOnly: true
        origin:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Origine
        status:
          type: string
          readOnly: true
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
        username:
          type: string
          nullable: true
          readOnly: true
        age:
          type: integer
          nullable: true
          readOnly: true
        relationship:
          allOf:
          - $ref: '#/components/schemas/Relationship'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
        resolvedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        refusalReason:
          allOf:
          - $ref: '#/components/schemas/RefusalReason'
          readOnly: true
          nullable: true
        refusalNote:
          type: string
          readOnly: true
          title: Précisions du refus
      required:
      - age
      - createdAt
      - expiresAt
      - firstName
      - id
      - lastName
      - origin
      - refusalNote
      - refusalReason
      - relationship
      - resolvedAt
      - status
      - username
    ConsentRequestState:
      type: object
      description: 'Demande vue par l''enfant (W07, W08, W18) : jamais le numéro du
        parent en clair.'
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConsentRequestStateStatusEnum'
          readOnly: true
          title: Statut
        parentPhoneMasked:
          type: string
          readOnly: true
        relationship:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
        resendInSec:
          type: integer
          readOnly: true
        refusalReason:
          allOf:
          - $ref: '#/components/schemas/RefusalReason'
          readOnly: true
          nullable: true
      required:
      - expiresAt
      - id
      - parentPhoneMasked
      - refusalReason
      - relationship
      - resendInSec
      - status
    ConsentRequestStateStatusEnum:
      enum:
      - pending
      - accepted
      - refused
      - expired
      - cancelled
      type: string
      description: |-
        * `pending` - En attente
        * `accepted` - Acceptée
        * `refused` - Refusée
        * `expired` - Expirée
        * `cancelled` - Annulée
    ContactMessageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 120
        contact:
          type: string
          writeOnly: true
          minLength: 1
          description: Email ou numéro de téléphone
          maxLength: 254
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectEnum'
          title: Sujet
        message:
          type: string
          minLength: 1
        website:
          type: string
          writeOnly: true
          description: 'Champ piège : toujours vide'
      required:
      - contact
      - message
      - name
      - subject
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: Code ISO
          maxLength: 2
        label:
          type: string
          title: Libellé
          maxLength: 120
        flag:
          type: string
          title: Drapeau
          maxLength: 8
        dialCode:
          type: string
          title: Indicatif
          description: 'Sans « + » : 229'
          maxLength: 4
        phoneFormat:
          type: string
          title: Format
          description: 'Gabarit d''affichage : « XX XX XX XX XX »'
          maxLength: 32
        phoneRegex:
          type: string
          title: Expression du numéro national
          description: Numéro sans indicatif, ex. ^01[0-9]{8}$
          maxLength: 120
      required:
      - code
      - dialCode
      - id
