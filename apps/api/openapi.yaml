  /api/auth/parent-signup/:
    post:
      operationId: auth_parent_signup_create
      description: 'WP01 : envoie un code au numéro. Réponse identique que le numéro
        soit inscrit ou non (C13).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentSignupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
          description: ''
