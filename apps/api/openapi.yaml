  /api/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      description: Nouveau code pour un défi en cours (60 s après le précédent, plafonds
        quotidiens D24).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
