        name: price
        schema:
          enum:
          - free
          - paid
          type: string
          minLength: 1
        description: |-
          * `free` - Gratuit
          * `paid` - Payant
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Recherche dans le titre et la description
      - in: query
        name: sort
        schema:
          enum:
          - popular
          - recent
          - price-asc
          - price-desc
          - title
          type: string
          default: popular
          minLength: 1
        description: |-
          * `popular` - popular
          * `recent` - recent
          * `price-asc` - price-asc
          * `price-desc` - price-desc
          * `title` - title
