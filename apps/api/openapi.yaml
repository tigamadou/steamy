    get:
      operationId: analytics_export_events.csv_retrieve
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: 'Par défaut : aujourd''hui'
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: 'Par défaut : il y a 7 jours'
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: Export CSV des événements
