  /api/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: Catégories avec le nombre de parcours publiés (WL06, WL16) ; liste
        courte, non paginée.
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
        '429':
