  description: API pour la plateforme de formation
paths:
  /api/analytics/dashboard/summary/:
    get:
      operationId: analytics_dashboard_summary_retrieve
      description: |-
        Exemple d'endpoint "dashboard" qui combine plusieurs métriques.
        On cache la réponse brièvement pour soulager la DB.
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
  /api/analytics/events/:
    get:
      operationId: analytics_events_list
      description: |-
        Endpoint d'ingestion d'événements. Permission : authenticated or AllowAny depending required.
        Clients (frontend/mobile/backend) envoient les events ici.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - analytics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: analytics_events_create
      description: |-
        Endpoint d'ingestion d'événements. Permission : authenticated or AllowAny depending required.
        Clients (frontend/mobile/backend) envoient les events ici.
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
