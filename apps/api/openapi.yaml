                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/learner-signup/password/:
    post:
      operationId: auth_learner_signup_password_create
      description: 'W10 : après l''accord du parent, choisit le mot de passe ; le
        compte devient actif et la session s''ouvre.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/learner-signup/resume/:
    post:
      operationId: auth_learner_signup_resume_create
      description: 'W07 « Reprendre mon inscription » (C5) : identifiant + code de
