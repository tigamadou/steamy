openapi: 3.0.3
info:
  title: API Steamy
  version: 1.0.0
  description: API pour la plateforme de formation
paths:
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/accounts/me/email/:
    post:
      operationId: accounts_me_email_create
      description: |-
        Changement d'email (WPD08, WT08). Pour l'enseignant, c'est son identifiant de connexion ; pour le parent, une
        adresse de contact (rapport hebdomadaire, D55), qui ne sert pas à se connecter (S4). L'apprenant renseigne la
        sienne dans son profil (WD17).
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/me/password/:
    post:
      operationId: accounts_me_password_create
      description: Changement de mot de passe (WD18, WPD08, WT08). La session en cours
        reste ouverte.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/analytics/dashboard/summary/:
    get:
      operationId: analytics_dashboard_summary_retrieve
      description: |-
        Exemple d'endpoint "dashboard" qui combine plusieurs métriques.
        On cache la réponse brièvement pour soulager la DB.
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
  /api/analytics/events/:
    post:
      operationId: analytics_events_create
      description: |-
        Ingestion des événements de télémétrie, en ÉCRITURE SEULE (S3) : personne ne lit, ne
        modifie ni ne supprime les événements par l'API. L'utilisateur est celui de la session,
        jamais une valeur fournie par le client. Plafonné par le throttling global (S9).
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingEventRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingEvent'
          description: ''
  /api/analytics/export/events/:
    get:
      operationId: analytics_export_events_retrieve
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: 'Par défaut : aujourd''hui'
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: 'Par défaut : il y a 7 jours'
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: Export CSV des événements
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion des apprenants, parents et enseignants (W16). Le personnel
        passe par l'admin (WAD15).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
