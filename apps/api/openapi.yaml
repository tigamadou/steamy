      - {}
      responses:
        '204':
          description: No response body
  /api/core/presign/:
    post:
      operationId: core_presign_create
      description: |-
        POST body: {"filename": "...", "content_type": "image/png"}
        returns: {"key": "...", "presign": {...}}
