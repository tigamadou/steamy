  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion des apprenants, parents et enseignants (W16). Le personnel
        passe par l'admin (WAD15).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
