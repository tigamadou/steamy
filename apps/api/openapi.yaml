components:
  schemas:
    AreaTypeEnum:
      enum:
      - urban
      - rural
      type: string
      description: |-
        * `urban` - Urbaine
        * `rural` - Rurale
    Avatar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 120
        emoji:
          type: string
          maxLength: 8
        color:
          type: string
          title: Couleur
          description: Jeton du design system, ex. « primary-500 »
          maxLength: 32
      required:
      - code
      - color
      - emoji
      - id
      - label
    Beneficiary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
      required:
      - firstName
      - id
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 80
        color:
          type: string
          title: Couleur
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          title: Icône
          description: Emoji affiché sur les cartes
          maxLength: 16
        courseCount:
          type: integer
          readOnly: true
          description: Parcours publiés
      required:
      - color
      - courseCount
      - icon
      - label
      - slug
    CategoryEnum:
      enum:
      - learning
      - rewards
      - coaching
      - events
      - payments
      - consents
      - progress
      - reviews
      - account
      type: string
      description: |-
        * `learning` - Apprentissage
        * `rewards` - Récompenses
        * `coaching` - Encadrement
        * `events` - Steamy Events
        * `payments` - Paiements
        * `consents` - Consentements et validations
        * `progress` - Progression
        * `reviews` - Tentatives à revoir
        * `account` - Compte
    CategoryPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        label:
          type: string
          readOnly: true
        inApp:
          type: boolean
          readOnly: true
          description: Toujours actif
        email:
          type: boolean
      required:
      - category
      - email
      - inApp
      - label
    CategoryPreferenceRequest:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        email:
          type: boolean
      required:
      - category
      - email
    CategorySummary:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 80
        color:
          type: string
          title: Couleur
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          title: Icône
          description: Emoji affiché sur les cartes
          maxLength: 16
      required:
      - color
      - icon
      - label
      - slug
    ConsentPreview:
      type: object
      description: 'Ce que montre le lien SMS avant toute connexion : le numéro masqué,
        rien de l''enfant.'
      properties:
        parentPhoneMasked:
          type: string
      required:
      - parentPhoneMasked
    ConsentRequest:
      type: object
      description: 'Demande vue par le parent (WP04, WP05) : seulement ce qui existe
        à ce stade (D20).'
      properties:
        id:
          type: integer
          readOnly: true
        origin:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Origine
        status:
          type: string
          readOnly: true
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
        username:
          type: string
          nullable: true
          readOnly: true
        age:
          type: integer
          nullable: true
          readOnly: true
