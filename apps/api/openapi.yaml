          type: integer
        percentage:
          type: integer
        threshold:
          type: integer
          description: Seuil appliqué à cette tentative (%)
        status:
          $ref: '#/components/schemas/AttemptStatusEnum'
        passed:
          type: boolean
        durationSec:
          type: integer
          nullable: true
