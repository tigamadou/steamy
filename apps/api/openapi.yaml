  /api/auth/learner-signup/:
    get:
      operationId: auth_learner_signup_retrieve
      description: 'W06-W10, W18 : étape réelle de l''inscription en cours (garde
        du layout du flux).'
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSignupState'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: auth_learner_signup_create
      description: 'W05 « Continuer » : crée le compte en attente et renvoie le code
        de reprise (une seule fois).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerSignupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSignupCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/auth/learner-signup/password/:
    post:
      operationId: auth_learner_signup_password_create
      description: 'W10 : après l''accord du parent, choisit le mot de passe ; le
        compte devient actif et la session s''ouvre.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
