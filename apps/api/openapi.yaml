  /api/catalog/courses/:
    get:
      operationId: catalog_courses_list
      description: Parcours publiés, filtrés et triés (WL01, WL06, WC01-WC03), paginés.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        description: Slug de la catégorie
      - in: query
        name: difficulty
        schema:
          enum:
          - beginner
          - intermediate
          - advanced
          type: string
          minLength: 1
        description: |-
          * `beginner` - Débutant
          * `intermediate` - Intermédiaire
          * `advanced` - Avancé
      - in: query
        name: featured
        schema:
          type: boolean
          nullable: true
        description: Parcours mis en avant (WL01)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price
        schema:
          enum:
          - free
          - paid
          type: string
          minLength: 1
        description: |-
          * `free` - Gratuit
          * `paid` - Payant
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Recherche dans le titre et la description
      - in: query
        name: sort
        schema:
          enum:
          - popular
          - recent
          - price-asc
          - price-desc
          - title
          type: string
          default: popular
          minLength: 1
        description: |-
          * `popular` - popular
          * `recent` - recent
          * `price-asc` - price-asc
          * `price-desc` - price-desc
          * `title` - title
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
