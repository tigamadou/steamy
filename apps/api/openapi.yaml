      description: Parcours publiés, filtrés et triés (WL01, WL06, WC01-WC03), paginés.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        description: Slug de la catégorie
      - in: query
        name: difficulty
        schema:
          enum:
          - beginner
          - intermediate
          - advanced
          type: string
          minLength: 1
        description: |-
          * `beginner` - Débutant
          * `intermediate` - Intermédiaire
          * `advanced` - Avancé
      - in: query
        name: featured
        schema:
          type: boolean
          nullable: true
        description: Parcours mis en avant (WL01)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
