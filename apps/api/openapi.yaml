components:
  schemas:
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        quiz:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        data:
          readOnly: true
          nullable: true
      required:
      - createdAt
      - data
      - id
      - passed
      - quiz
      - score
      - user
    AttemptCreate:
      type: object
      description: |-
        Atttempt: client envoie `data` : {question_id: choice_id} pour MCQ/TF
        On calcule le score côté serveur à la sauvegarde via create()
      properties:
        id:
          type: integer
          readOnly: true
        quiz:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        data:
          nullable: true
      required:
      - createdAt
      - id
      - passed
      - quiz
      - score
    AttemptCreateRequest:
      type: object
      description: |-
        Atttempt: client envoie `data` : {question_id: choice_id} pour MCQ/TF
        On calcule le score côté serveur à la sauvegarde via create()
      properties:
        quiz:
          type: integer
        data:
          nullable: true
      required:
      - quiz
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        enrollment:
          type: integer
        issuedAt:
          type: string
          format: date-time
          readOnly: true
        file:
          type: string
          format: uri
          nullable: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
      required:
      - enrollment
      - id
      - issuedAt
    Choice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
      required:
      - id
      - question
      - text
    CourseDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        path:
          type: integer
          readOnly: true
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
          readOnly: true
      required:
      - createdAt
      - description
      - id
      - modules
      - path
      - price
      - slug
      - title
      - updatedAt
    CourseList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        path:
          type: integer
          readOnly: true
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - description
      - id
      - path
      - price
      - slug
      - title
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DashboardSummary:
      type: object
      properties:
        totalUsers:
          type: integer
        eventsLast7Days:
          type: integer
        revenueLast30Days:
          type: number
          format: double
      required:
      - eventsLast7Days
      - revenueLast30Days
      - totalUsers
    EmailChangeRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
      required:
      - email
      - password
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        startedAt:
          type: string
          format: date-time
          readOnly: true
        completed:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          readOnly: true
        progress:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - completed
      - course
      - id
      - progress
      - startedAt
      - status
    EnrollmentRequest:
      type: object
      properties:
        course:
          type: integer
      required:
      - course
    EnrollmentStatusEnum:
      enum:
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `active` - Actif
        * `completed` - Terminé
        * `cancelled` - Annulé
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        database:
          type: boolean
        cache:
          type: boolean
      required:
      - cache
      - database
      - status
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    KindEnum:
      enum:
      - mcq
      - tf
      - free
      type: string
      description: |-
        * `mcq` - QCM
        * `tf` - Vrai/Faux
        * `free` - Libre
    Lesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        content:
          type: string
          readOnly: true
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeEnum'
          readOnly: true
        order:
          type: integer
          readOnly: true
          default: 0
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          readOnly: true
      required:
      - content
      - id
      - module
      - order
      - resourceType
      - resources
      - title
    LessonSummary:
      type: object
      description: 'Plan du parcours, sans contenu : visible avant l''inscription.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceTypeEnum'
          readOnly: true
        order:
          type: integer
          readOnly: true
      required:
      - id
      - order
      - resourceType
      - title
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          description: Identifiant, numéro de téléphone ou email (C7)
          maxLength: 255
        password:
          type: string
          minLength: 1
      required:
      - identifier
      - password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
        csrfToken:
          type: string
      required:
      - csrfToken
      - user
    Me:
      type: object
      description: 'Identité et rôle du compte connecté : sert aux shells, à la redirection
        après W16 et aux gardes (§7.3).'
      properties:
        id:
          type: integer
          readOnly: true
        role:
          readOnly: true
          nullable: true
          title: Rôle
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/MeStatusEnum'
          readOnly: true
          title: Statut
        username:
          type: string
          readOnly: true
          nullable: true
          title: Identifiant
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Téléphone
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Adresse email
        firstName:
          type: string
          readOnly: true
          title: Prénom
        lastName:
          type: string
          readOnly: true
          title: Nom
        profileStep:
          description: Étape de profil restante (W11-W14, WP07-WP09), null si le profil
            est complet
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ProfileStepEnum'
          - $ref: '#/components/schemas/NullEnum'
        isStaff:
          type: boolean
          readOnly: true
        otpVerified:
          type: boolean
          description: Session du personnel validée par TOTP (D72) ; toujours faux
            pour un persona.
          readOnly: true
        staffGroups:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - firstName
      - id
      - isStaff
      - lastName
      - otpVerified
      - phone
      - profileStep
      - role
      - staffGroups
      - status
      - username
    MeStatusEnum:
      enum:
      - pending
      - active
      - suspended
      - deactivated
      - anonymized
      type: string
      description: |-
        * `pending` - En attente de consentement
        * `active` - Actif
        * `suspended` - Suspendu
        * `deactivated` - Désactivé
        * `anonymized` - Anonymisé
    Module:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
          default: 0
        lessons:
          type: array
