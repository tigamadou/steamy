  /api/shop/kits/:
    get:
      operationId: shop_kits_list
      description: Kits en vente, paginés.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        description: Slug de la catégorie
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - shop
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKitList'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/shop/kits/{slug}/:
    get:
      operationId: shop_kits_retrieve
      description: Fiche kit (WK02) ; un kit retiré de la vente répond 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - shop
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
