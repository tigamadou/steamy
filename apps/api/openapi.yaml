components:
  schemas:
    AreaTypeEnum:
      enum:
      - urban
      - rural
      type: string
      description: |-
        * `urban` - Urbaine
        * `rural` - Rurale
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        quiz:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        data:
          readOnly: true
          nullable: true
      required:
      - createdAt
      - data
      - id
      - passed
      - quiz
      - score
      - user
    AttemptCreate:
      type: object
      description: |-
        Atttempt: client envoie `data` : {question_id: choice_id} pour MCQ/TF
        On calcule le score côté serveur à la sauvegarde via create()
      properties:
        id:
          type: integer
          readOnly: true
        quiz:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        data:
          nullable: true
      required:
      - createdAt
      - id
      - passed
      - quiz
      - score
    AttemptCreateRequest:
      type: object
      description: |-
        Atttempt: client envoie `data` : {question_id: choice_id} pour MCQ/TF
        On calcule le score côté serveur à la sauvegarde via create()
      properties:
        quiz:
          type: integer
        data:
          nullable: true
      required:
      - quiz
    Avatar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 120
        emoji:
          type: string
          maxLength: 8
        color:
          type: string
          title: Couleur
          description: Jeton du design system, ex. « primary-500 »
          maxLength: 32
      required:
      - code
      - color
      - emoji
      - id
      - label
    Category:
      type: object
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          title: Libellé
          maxLength: 80
        color:
          type: string
          title: Couleur
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          title: Icône
          description: Emoji affiché sur les cartes
          maxLength: 16
        courseCount:
          type: integer
          readOnly: true
          description: Parcours publiés
      required:
      - color
      - courseCount
      - icon
      - label
      - slug
    CategoryEnum:
      enum:
      - learning
      - rewards
      - coaching
      - events
      - payments
      - consents
      - progress
      - reviews
      - account
      type: string
      description: |-
        * `learning` - Apprentissage
        * `rewards` - Récompenses
        * `coaching` - Encadrement
        * `events` - Steamy Events
        * `payments` - Paiements
        * `consents` - Consentements et validations
        * `progress` - Progression
        * `reviews` - Tentatives à revoir
        * `account` - Compte
