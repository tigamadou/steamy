<!doctype html>
<html lang="fr">

<head>

  <link rel="stylesheet" href="ds-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..500&display=swap"

  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
    }

    body {
      background: #f0eee9;
    }

    /* Below a tablet width, stack the right-side artwork under the text block
     so the layout stays legible - desktop framing is the primary target. */

    @media (max-width: 960px) {
      .welcome-shell {
        padding: 40px 32px 24px !important;
      }

      .welcome-grid {
        grid-template-columns: 1fr !important;
        gap: 36px !important;
      }
    }
  </style>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"

    crossorigin="anonymous"></script>

      <WelcomeFlow />);
  </script>

</html>
