# Surcharge pour les parcours Playwright : `make e2e` (voir le Makefile).
#   docker compose -p steamy-e2e -f compose.yml -f compose.e2e.yml …
# - le web est servi par l'image de production (`next dev` est trop lent et instable pour des parcours) ;
# - aucun port publié : la stack e2e cohabite avec la stack de dev (`make up`) ;
# - Playwright tourne dans l'image officielle, qui embarque les navigateurs (même version que @playwright/test) ;
# - le navigateur joint le web et l'API sous un domaine parent commun (`web.steamy.test`, `api.steamy.test`), comme
#   en production : le cookie de session posé par l'API (`COOKIE_DOMAIN`) est lu par le serveur Next.

services:
  postgres:
    ports: !reset []

  rustfs:
    ports: !reset []

  mailpit:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,api,api.steamy.test
      WEB_URL: http://web.steamy.test:3000
      COOKIE_DOMAIN: steamy.test
      # Les parcours reconnectent les mêmes comptes de démo depuis une seule IP : plafonds de connexion relevés
      # (le throttling lui-même est couvert par les tests de l'API)
      THROTTLE_ANON: 1000/min
      THROTTLE_LOGIN: 1000/min
      THROTTLE_LOGIN_IDENTIFIER: 1000/hour
      # Connexion du personnel (WAD15) : mêmes comptes reconnectés par plusieurs specs
      THROTTLE_STAFF_LOGIN: 1000/min
      THROTTLE_STAFF_LOGIN_EMAIL: 1000/hour
      # Formulaires publics (devis, contact, newsletter) : 10/heure par IP en production, épuisé par les reprises
      THROTTLE_PUBLIC_FORM: 1000/hour
    networks:
      default:
        aliases: [api.steamy.test]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: steamy-web-e2e
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    working_dir: /app
    command: ["node", "apps/web/server.js"]
    environment:
      # Le navigateur de Playwright joint l'API par le réseau de la stack, sous le domaine parent des cookies
      PUBLIC_API_URL: http://api.steamy.test:8000
    networks:
      default:
        aliases: [web.steamy.test]
    volumes: !reset []
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on: !override
      api:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    working_dir: /repo
    environment:
      CI: ${CI:-}
      BASE_URL: http://web.steamy.test:3000
      # Admin Django du back-office (WAD15), servi par l'API
      API_URL: http://api.steamy.test:8000
      # Emails et faux SMS (adressés à `<e164>@sms.test`) lus par les helpers de `e2e/support/`
      MAILPIT_URL: http://mailpit:8025
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: >
      sh -c "corepack enable
      && pnpm install --frozen-lockfile --filter '@steamy/web...' --store-dir /pnpm-store --config.confirm-modules-purge=false
      && pnpm --filter @steamy/web e2e"
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - api_client_node_modules:/repo/packages/api-client/node_modules
      - pnpm_store:/pnpm-store
    depends_on:
      web:
        condition: service_healthy
